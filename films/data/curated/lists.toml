# 榜单定义（真相源）。每个榜单一条；entries 在 entries/{list_id}.csv。
# 路径约定：本文本里的路径相对 films/ 根。
# 口径决策未定时 decision 写 pending，禁止上线。
# 条数规则：max_entries 是上限，不是目标。count 必须等于 entries 实际条数；
# 不够 100 就如实，禁止为凑数收录平庸之作。

schema_version = 1

[[lists]]
id = "global-mystery-greatest"
title = "影史最伟大的悬疑片"
criterion = "greatest"
status = "draft"
decision = "pending"
max_entries = 100
count = 0                  # 必须等于 entries 实际条数，可为 40、60、97，不要求 100        # pending | authority | self_computed | hybrid
genres = ["mystery"]
chapters = []               # 每 10 部一个卷名，人工命名

[lists.scope]
kind = "global"
countries = []

[lists.canon]
definition = ""             # 这个榜在选什么
ranking_rule = ""           # 具体怎么排序，必须可复现
time_window = ""            # 例：1895–2024
sources = []                # [{name, url, weight, accessed}]
inclusion_rule = ""
exclusion_rule = ""
known_bias = ""
curator = ""
version = "1"

