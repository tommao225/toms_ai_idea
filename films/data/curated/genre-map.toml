# TMDb 类型到本站九类的映射。榜单只用本站类型，未命中的归 other。

schema_version = 1

[site_genres]
mystery = "悬疑"
scifi = "科幻"
action = "动作"
drama = "剧情"
comedy = "喜剧"
romance = "爱情"
crime = "犯罪"
animation = "动画"
horror = "恐怖"

[map]
Mystery = ["mystery"]
Thriller = ["mystery"]
Crime = ["crime"]
"Science Fiction" = ["scifi"]
Action = ["action"]
Adventure = ["action"]
War = ["action"]
Western = ["action"]
Drama = ["drama"]
Comedy = ["comedy"]
Romance = ["romance"]
Animation = ["animation"]
Horror = ["horror"]
Fantasy = ["other"]
Documentary = ["other"]
History = ["other"]
Music = ["other"]
Family = ["other"]
"TV Movie" = ["other"]
