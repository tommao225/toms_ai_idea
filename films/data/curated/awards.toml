# 奖项定义与分级。award / category 用固定 slug，管线只接受这里定义过的值。
# 分级依据见 docs/02-data-and-canon.md §5。

schema_version = 1

[tiers]
"A" = "全球公认、影响影史的奖"
"A-" = "影响力大但争议明显"
"B" = "国家级最高奖 / 一线地区奖"
"C" = "类型专项奖"
"D" = "参考级，不进主榜单"

